# Main now qualifies surviving Sol/native workflows; archived Python/Bash coverage is retired.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sol-native:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 60
    defaults:
      run:
        shell: sh
    steps:
      - uses: actions/checkout@v4
      - name: Native build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates make gcc pkg-config ghc cabal-install libghc-megaparsec-dev libghc-network-dev libghc-utf8-string-dev libgit2-dev libarchive-dev libcurl4-openssl-dev libegl-dev libgl-dev jq
      - name: Read compiler pin
        id: pin
        run: echo "revision=$(jq -r .revision fprisc.lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: hyperswine/fprisc
          ref: ${{ steps.pin.outputs.revision }}
          path: fprisc
      - name: Build pinned compiler
        working-directory: fprisc
        run: |
          rm -f cabal.project.freeze
          cabal update
          make fpr
      - name: Sol policy, host and bundle smoke
        env:
          FPRISC_ROOT: ${{ github.workspace }}/fprisc
          FPR_HOME: ${{ github.workspace }}
          FPR_PATH: ${{ github.workspace }}/fprisc
          SOL: /usr/local/bin/sol
        run: |
          ln -s "$FPRISC_ROOT/fpr" /usr/local/bin/sol
          sol tools/sol-only-check.sol
          sol tools/checkout.sol build host
          sol tools/checkout.sol pack tests/sol-hello.fpr --out build/sol-smoke/hello --bundle
          build/sol-smoke/hello/run
