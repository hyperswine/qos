# Main now qualifies surviving Sol/native workflows; archived Python/Bash coverage is retired.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sol-native:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 60
    defaults:
      run:
        shell: sh
    steps:
      # git first: without it in the container, actions/checkout downloads an
      # archive with no .git, and the policy check reads the tracked files from git
      - name: Native build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates make gcc pkg-config ghc cabal-install libghc-megaparsec-dev libghc-network-dev libghc-utf8-string-dev libgit2-dev libarchive-dev libcurl4-openssl-dev libegl-dev libgl-dev jq
      - uses: actions/checkout@v4
      - name: Read compiler pin
        id: pin
        run: echo "revision=$(jq -r .revision fprisc.lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: hyperswine/fprisc
          ref: ${{ steps.pin.outputs.revision }}
          path: fprisc
      - name: Build pinned compiler
        working-directory: fprisc
        run: |
          rm -f cabal.project.freeze
          cabal update
          make fpr
      - name: Sol policy, host and bundle smoke
        env:
          FPRISC_ROOT: ${{ github.workspace }}/fprisc
          FPR_HOME: ${{ github.workspace }}
          FPR_PATH: ${{ github.workspace }}/fprisc
          SOL: /usr/local/bin/sol
        run: |
          ln -s "$FPRISC_ROOT/fpr" /usr/local/bin/sol
          # the workspace belongs to the runner's user and this container runs as root
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sol tools/sol-only-check.sol
          sol tools/checkout.sol build host
          sol tools/checkout.sol pack tests/sol-hello.fpr --out build/sol-smoke/hello --bundle
          build/sol-smoke/hello/run
      - name: Type-check QOS modules and apps against pinned compiler
        run: |
          set -e
          # Paths from $GITHUB_WORKSPACE, the checkout as THIS container sees
          # it (/__w/...). ${{ github.workspace }} is the runner host's path,
          # so FPR_PATH roots built from it missed std/encoding in fprisc.
          export FPRISC_ROOT="$GITHUB_WORKSPACE/fprisc"
          export FPR_HOME="$GITHUB_WORKSPACE"
          export FPR_PATH="$GITHUB_WORKSPACE/programs:$GITHUB_WORKSPACE/fprisc"
          export FPR_FOREIGN="$GITHUB_WORKSPACE/core/foreign.fpr"
          check_file() {
            echo "checking $1"
            if ! "$FPRISC_ROOT/fpr" --target=qx64 --plugin --editor-json --prelude="$FPRISC_ROOT/core/prelude.fpr" "$1" /dev/null > /dev/null 2>&1; then
              "$FPRISC_ROOT/fpr" --target=qx64 --plugin --editor-json --prelude="$FPRISC_ROOT/core/prelude.fpr" "$1" /dev/null 2>/dev/null || true
              exit 1
            fi
          }
          for app in apps/browser.fpr apps/clock.fpr apps/disk.fpr apps/editor.fpr apps/hello_proc.fpr apps/logs.fpr apps/terminal.fpr; do
            check_file "$app"
          done
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          for mod in gamerun guishell qsys; do
            printf 'unsafe program.\nM = use "mods/%s".\nmain = Unit.\n' "$mod" > "$tmp/$mod.fpr"
            check_file "$tmp/$mod.fpr"
          done
