# Pi 4 / BCM43455 with the pinned 6.6 kernel and Cypress firmware:
# firmware supplicant offload stalls at ASSOCIATED with wpa_supplicant 2.12.
# BRCMF_FEAT_FWSUP is bit 13 in this kernel's brcmfmac/feature.h.
# Let wpa_supplicant perform the WPA2 handshake instead.
options brcmfmac feature_disable=0x2000
