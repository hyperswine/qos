# release.toml -- what a QOS FPR release IS.  Read by `./qos.py lock` and
# `./qos.py release` (docs/VERSIONING.md, "Three layers").
#
#   version   the next tag: `./qos.py release` mints v<version>; passing a
#             version on the command line rewrites this line first
#   apps      the programs packed as stamped, self-contained bundles
#             (dist/qos-fpr-vX.Y.Z/<name>/: .qa + qosp + run.sh)
#   modules   the library modules `fpr commit`ed on every release, so each
#             pin in the tree names a committed version (fpr.lock)

version = "1.1.0"

apps = [
  "tests/pos.fpr",      # POS v2 over FPRLive: the LiveView app, an actor per session
  "tests/hello.fpr",    # the smallest hosted .qa
  "programs/terra2.fpr", # Terra II on the GL host (`#: host gl` -> qosp-gl in the bundle)
  "programs/pos1.fpr",   # POS v1: the shop as one log, registers over FPRLive (docs/POS1.md)
  "programs/dungeon.fpr", # the dungeon crawler on the GL host (docs/DUNGEON.md)
]

modules = [
  "programs/mods/coreutil.fpr",
  "programs/mods/uart.fpr",
  "programs/mods/timer.fpr",
  "programs/mods/svc.fpr",
  "programs/mods/qlog.fpr",
  "programs/mods/timefmt.fpr",
  "programs/mods/tui.fpr",
]
