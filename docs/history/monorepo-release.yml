# release.yml -- a pushed tag vX.Y.Z becomes a GitHub Release carrying the
# same bundles `./qos.py release` builds locally (docs/VERSIONING.md).
#
# The tag is the identity: release.toml's version must equal the tag
# (`qos.py release --no-git` refuses otherwise), fpr.lock must be current,
# and the archive that lands on the release is byte-for-byte what a
# checkout of that tag builds -- no hand-uploaded binaries.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git describe needs the tags

      - name: toolchain (ghc + the cabal deps as distro packages, gcc, mesa)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ghc libghc-megaparsec-dev libghc-network-dev \
            libghc-utf8-string-dev libghc-mtl-dev build-essential python3 \
            libgl-dev libegl-dev libglfw3-dev

      - name: pins are committed versions and the lock is current
        run: ./qos.py lock --check

      - name: build + pack the release bundles for this tag
        run: ./qos.py release "${GITHUB_REF_NAME}" --no-git --skip-tests

      - name: GitHub Release (notes = RELEASE.txt; assets = tarball + sums + lock)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D="dist/qos-fpr-${GITHUB_REF_NAME}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "qos-fpr ${GITHUB_REF_NAME}" \
            --notes-file "$D/RELEASE.txt" \
            dist/qos-fpr-${GITHUB_REF_NAME}-*.tar.gz "$D/SHA256SUMS" "$D/fpr.lock"
